services:
  mysql:
    image: mysql:8.0
    container_name: reimvault-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ./mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    image: eclipse-temurin:21-jre
    container_name: reimvault-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /app
    command:
      - java
      - -jar
      - /app/app.jar
      - --server.port=8080
      - --spring.datasource.url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      - --spring.datasource.username=${MYSQL_USER}
      - --spring.datasource.password=${MYSQL_PASSWORD}
      - --app.storage.root=/data/files
      - --app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME}
      - --app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD}
      - --app.bootstrap.admin.display-name=${BOOTSTRAP_ADMIN_DISPLAY_NAME}
      - --app.bootstrap.admin.department=${BOOTSTRAP_ADMIN_DEPARTMENT}
    volumes:
      - ./backend/app.jar:/app/app.jar:ro
      - ./files:/data/files
    ports:
      - "127.0.0.1:18083:8080"
