spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/reimbursement?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:reimbursement}
    password: ${DB_PASSWORD:reimbursement}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: 8080
app:
  storage:
    root: storage/reimbursements
